# Supabase CLI configuration.
#
# The reference for every option is
# https://supabase.com/docs/guides/local-development/cli/config
#
# Trimmed to what this project needs. The defaults the CLI generates are fine
# everywhere they are not mentioned below.

project_id = "cofibuy"

[api]
port = 54321

# `api` is the schema every customer and admin call goes through, and it is not
# in the default list. Without this the Data API 404s on `api.create_order` and
# friends even though the grants and row level security are all correct.
#
# On a hosted project this list is Project Settings -> API -> Exposed schemas.
schemas = ["public", "graphql_public", "api"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"

# Must match the remote project, or the shadow database used by `db diff` is a
# different major version and the diff is meaningless. Check with
# `show server_version;` on the remote database.
major_version = 17

[db.migrations]
enabled = true

# `supabase db reset` replays the migrations and then runs this. `supabase db
# push` to a hosted project does not, which is why seed.sql says so at the top.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# No Realtime for customers: order status is polled, so a socket per open tab buys
# nothing. Left enabled for the dashboard.
[realtime]
enabled = true

[storage]
enabled = true
# The `proofs` bucket sets its own, lower limit. This is the project-wide cap.
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

# The customer flow signs people in without asking for an email first. The
# database keys everything on `auth.uid()`, so an anonymous session is enough to
# own an order.
enable_signup = true
enable_anonymous_sign_ins = true

minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false

# Bangladesh carrier CGNAT puts many subscribers behind one public IP, which is
# what the anonymous limit is actually counting. Turnstile keeps the signup form
# usable without opening the limit to abuse; uncomment once you have the keys.
#
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(TURNSTILE_SECRET_KEY)"

# ---------------------------------------------------------------------------
# Edge Functions
# ---------------------------------------------------------------------------
#
# `verify_jwt = false` on both bKash functions, deliberately.
#
# These authenticate the *customer*: the Authorization header carries the signed-in
# user's Supabase JWT, forwarded unchanged to the Data API as that user. With the
# gateway check left on, an expired or unsigned token is rejected by the gateway with
# a bare 401 that has no body, and the frontend has to special-case a second error
# shape. Turning it off means every failure - including "sign in first" - arrives as
# the same `{ error, detail }` the payment UI already renders.
#
# Authorization does not rest on this. `api.bkash_payment_start` and
# `api.bkash_payment_claim` both compare `auth.uid()` against the order, so a caller
# who is not the customer gets `order not found` whichever way they call, and every
# secret read happens on a service-role client *after* that check has passed.
#
# The service-role key is read from the environment and never from a header. If it
# were accepted from the caller, anyone could supply their own and this whole file
# would be a way to read a shop's merchant password.
[functions.bkash-create-payment]
verify_jwt = false

[functions.bkash-execute]
verify_jwt = false

[functions.ai-fill-form]
# The function authorizes its caller against `admin_pages` with the caller's own
# JWT, so platform verification is redundant with the database guard - and the
# guard answers with a useful error body instead of a bare gateway 401.
verify_jwt = false

[functions.geo-country]
# Country from the edge's own request metadata - nothing to verify, nothing to
# read from the database, and the caller is an anonymous storefront.
verify_jwt = false

[functions.telegram-request-invite]
# The function verifies staff via admin_pages through the caller's own JWT,
# and the bot authenticates the proxy call with a shared secret.
verify_jwt = false
