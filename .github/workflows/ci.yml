name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Supabase CLI
        run: npx --yes supabase@2.118.0 --version

      - name: Format
        run: npm run format:check

      # The Edge Functions are a separate TypeScript program that `npm run typecheck` never
      # sees, and until now nothing in CI saw it either - a signature change under
      # `supabase/functions/` would break a deploy and still go green here. Ahead of Lint on
      # purpose: lint sits at its known 162-error baseline, and a step placed after a failing
      # step is a step that never runs.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.0

      - name: Edge functions typecheck
        run: npm run functions:check

      - name: Edge function tests
        run: npm run functions:test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npx vite build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Runs the migrations against a real PostgreSQL and executes the
      # database test suite. No Docker required, so this also works on hosts
      # where the Supabase CLI cannot start its own stack.
      - name: Database tests
        run: npm run test:db

      # Rebuilds the generated types from those same migrations and fails if the
      # committed copy differs, so a migration that changes an RPC signature
      # cannot land without the app types following it.
      - name: Generated types are current
        run: npm run db:types:check
